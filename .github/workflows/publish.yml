name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# pub.dev's automated publishing uses OIDC — this workflow needs no secrets,
# but the `pub.dev` package settings must have this repo + workflow
# authorized as a trusted publisher (Package admin page -> Automated
# publishing) and the tag pattern must match `pubspec.yaml`'s `version:`.
permissions:
  id-token: write # required for OIDC authentication to pub.dev

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test
      - run: dart pub publish --force
